[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rugguard"
version = "0.1.0"
description = "Rug-pull and dump-risk signals for NEAR NEP-141 tokens"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
rugguard = "rugguard.cli:main"

[tool.setuptools.packages.find]
include = ["rugguard*"]

[tool.setuptools.package-data]
"rugguard.storage" = ["schema.sql"]
"rugguard.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
