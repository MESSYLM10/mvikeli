[package]
name = "guard-vault"
version = "0.1.0"
edition = "2021"
description = "RugGuard guard vault: an AI agent with a function-call key can only swap through risk and spending checks"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
